<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Cyber Cyan Radial Beam -->
    <radialGradient id="cyanBeam" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#cyanBeam)"/>

  <!-- Glowing Border Outline -->
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Logo Mark Container -->
  <g transform="translate(100, 110)">
    <!-- Glow Box -->
    <rect width="84" height="84" rx="24" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Sparkles Icon -->
    <path d="M42 18 L46 36 L64 42 L46 48 L42 66 L38 48 L20 42 L38 36 Z" fill="#06b6d4"/>
    <circle cx="58" cy="26" r="3" fill="#22d3ee"/>
    <circle cx="26" cy="58" r="2.5" fill="#22d3ee"/>
  </g>

  <!-- Version Pill -->
  <g transform="translate(205, 134)">
    <rect width="110" height="36" rx="18" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="55" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#22d3ee" text-anchor="middle">v1.1.0</text>
  </g>

  <!-- Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#textGrad)" letter-spacing="-2">Doni UI</text>

  <!-- Subtitle -->
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">The Fastest, Spring-Animated, Hyper-Themeable React UI Library</text>

  <!-- Feature Badges Row -->
  <g transform="translate(100, 400)">
    <!-- Badge 1: 55+ Components -->
    <rect x="0" y="0" width="190" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">📦 55+ Components</text>

    <!-- Badge 2: 1,000+ Icons -->
    <rect x="206" y="0" width="220" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="316" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">✨ 1,000+ Animated Icons</text>

    <!-- Badge 3: 0ms Lag -->
    <rect x="442" y="0" width="180" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="532" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#06b6d4" text-anchor="middle">🚀 0ms Runtime Lag</text>

    <!-- Badge 4: Dynamic Theme -->
    <rect x="638" y="0" width="210" height="48" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="743" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">🎨 Any-Hex Theme Studio</text>
  </g>

  <!-- Footer Link & Metadata -->
  <g transform="translate(100, 520)">
    <text x="0" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="18" font-weight="600" fill="#06b6d4">charitha-only.github.io/doni-ui</text>
    <text x="1000" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="end">By Charitha • MIT License</text>
  </g>
</svg>